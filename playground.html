<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEL Playground — Compiler Core v1.0</title>
<link rel="stylesheet" href="06-Implementation/platforms/css/variables.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--ael-typography-font-primary); display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--ael-color-gray-50); border-right: 1px solid var(--ael-color-border); padding: 24px 0; overflow-y: auto; position: sticky; top: 0; height: 100vh; }
.sidebar h2 { padding: 0 24px 16px; font-size: 18px; color: var(--ael-color-text-primary); }
.sidebar .group { padding: 4px 0; }
.sidebar .group-title { padding: 8px 24px; font-size: 12px; font-weight: 600; color: var(--ael-color-text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
.sidebar .comp { display: block; padding: 8px 24px 8px 36px; font-size: 14px; color: var(--ael-color-text-primary); cursor: pointer; text-decoration: none; transition: background 0.1s; border: none; background: none; width: 100%; text-align: left; }
.sidebar .comp:hover { background: var(--ael-color-gray-100); }
.sidebar .comp.active { background: var(--ael-color-primary); color: #fff; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.toolbar { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--ael-color-border); }
.toolbar button { padding: 6px 16px; font-size: 13px; border: 1px solid var(--ael-color-border); background: var(--ael-color-background); border-radius: var(--ael-radius-sm); cursor: pointer; color: var(--ael-color-text-secondary); }
.toolbar button.active { background: var(--ael-color-primary); color: #fff; border-color: var(--ael-color-primary); }

.content { display: flex; flex: 1; min-height: 0; }
.preview { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--ael-color-gray-50); }
.code-panel { width: 480px; background: var(--ael-color-text-primary); color: #e0e0e0; padding: 24px; overflow-y: auto; font-family: var(--ael-typography-font-mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap; display: none; }
.code-panel.visible { display: block; }
.status { padding: 8px 24px; font-size: 12px; color: var(--ael-color-text-secondary); border-top: 1px solid var(--ael-color-border); background: var(--ael-color-gray-50); }

.toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
</style>
</head>
<body>

<aside class="sidebar">
  <h2>AEL Playground</h2>
  <div class="group"><div class="group-title">Overlay</div>
    <button class="comp active" data-comp="modal">Modal</button>
    <button class="comp" data-comp="drawer">Drawer</button>
  </div>
  <div class="group"><div class="group-title">Form</div>
    <button class="comp" data-comp="input">Input</button>
    <button class="comp" data-comp="textarea">Textarea</button>
    <button class="comp" data-comp="select">Select</button>
  </div>
  <div class="group"><div class="group-title">Action</div>
    <button class="comp" data-comp="button">Button</button>
    <button class="comp" data-comp="checkbox">Checkbox</button>
  </div>
  <div class="group"><div class="group-title">Navigation</div>
    <button class="comp" data-comp="tabs">Tabs</button>
    <button class="comp" data-comp="menu">Menu</button>
  </div>
  <div class="group"><div class="group-title">Disclosure</div>
    <button class="comp" data-comp="accordion">Accordion</button>
  </div>
  <div class="group"><div class="group-title">Feedback</div>
    <button class="comp" data-comp="toast">Toast</button>
    <button class="comp" data-comp="tooltip">Tooltip</button>
  </div>
  <div class="group"><div class="group-title">Container</div>
    <button class="comp" data-comp="card">Card</button>
  </div>
  <div class="group"><div class="group-title">Data</div>
    <button class="comp" data-comp="badge">Badge</button>
    <button class="comp" data-comp="table">Table</button>
    <button class="comp" data-comp="timeline">Timeline</button>
  </div>
</aside>

<main class="main">
  <div class="toolbar">
    <button class="tab active" data-tab="preview">Preview</button>
    <button class="tab" data-tab="html">Canonical HTML</button>
    <button class="tab" data-tab="react">React Output</button>
    <button class="tab" data-tab="vue">Vue Output</button>
  </div>
  <div class="content">
    <div class="preview" id="preview"></div>
    <div class="code-panel visible" id="code-html"></div>
    <div class="code-panel" id="code-react"></div>
    <div class="code-panel" id="code-vue"></div>
  </div>
  <div class="status" id="status">Modal — CMP-modal — overlay</div>
</main>

<div class="toast-container" id="toasts"></div>

const status = document.getElementById('status');
const preview = document.getElementById('preview');
const panels = {
  html: document.getElementById('code-html'),
  react: document.getElementById('code-react'),
  vue: document.getElementById('code-vue')
};

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadCode(name) {
  try {
    const r1 = await fetch(`06-Implementation/Components/${name.charAt(0).toUpperCase()+name.slice(1)}/${name}.html`);
    panels.html.innerHTML = `<pre>${escapeHtml(await r1.text())}</pre>`;
  } catch(e) { panels.html.innerHTML = `<pre>${escapeHtml(components[name]?.html || '')}</pre>`; }

  try {
    const r2 = await fetch(`06-Implementation/platforms/react/src/${name.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('')}.jsx`);
    panels.react.innerHTML = `<pre>${escapeHtml(await r2.text())}</pre>`;
  } catch(e) { panels.react.innerHTML = `<pre>// React component not generated for ${name}</pre>`; }

  try {
    const r3 = await fetch(`06-Implementation/platforms/vue/src/${name.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('')}.vue`);
    panels.vue.innerHTML = `<pre>${escapeHtml(await r3.text())}</pre>`;
  } catch(e) { panels.vue.innerHTML = `<pre>// Vue component not generated for ${name}</pre>`; }
}

function showComponent(name) {
  const comp = components[name];
  if (!comp) return;

  preview.innerHTML = '';
  preview.appendChild(comp.render());
  status.textContent = `${name.charAt(0).toUpperCase()+name.slice(1)} — ${name} — AEL Playground`;

  if (name === 'tooltip') {
    const tt = document.getElementById('pg-tooltip');
    const target = document.getElementById('tt-target');
    if (tt && target) {
      target.onmouseenter = () => tt.hidden = false;
      target.onmouseleave = () => tt.hidden = true;
    }
  }

  loadCode(name);
}

document.querySelectorAll('.sidebar .comp').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sidebar .comp').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showComponent(btn.dataset.comp);
  });
});

document.querySelectorAll('.toolbar .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toolbar .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    if (tab === 'preview') {
      Object.values(panels).forEach(p => p.classList.remove('visible'));
      preview.style.display = 'flex';
    } else {
      preview.style.display = 'none';
      Object.entries(panels).forEach(([k, p]) => p.classList.toggle('visible', k === tab));
    }
  });
});

window.showToast = () => {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'ael-toast';
  toast.setAttribute('role', 'status');
  toast.innerHTML = '<span>Operation completed successfully.</span>';
  container.appendChild(toast);
  toast.hidden = false;
  setTimeout(() => { toast.hidden = true; setTimeout(() => toast.remove(), 300); }, 3000);
};

showComponent('modal');
</script>
